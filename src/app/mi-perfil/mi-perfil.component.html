<div class="perfil-container">
  <div class="menuContainer">
    <!--<app-menu></app-menu>-->
    <div>
      <button class="btn-wrap" 
        (click)="esControladorBanca() ? irAdmin() : volver()">
        <img class="btn-submitLeft" src="../../../assets/image/atras.png" alt="Logo">
      </button>
    </div>
  </div>
        <button class="btn-wrap btn-wrap-right" (click)="retorno()">
  <img class="btn-submitRight" src="../../../assets/image/download.png" alt="Descargar">
</button>
  <div class="perfil-content">
    <img src="assets/image/Mi_perfil_fondo.png" alt="mi perfil fondo" class="perfil-fondo">
    <h1 class="titulo">{{ nombreUsuario }}</h1>
    
    <div class="perfil-imagen">
      <div class="gallo-circulo"(mouseenter)="showChangePhoto = true" (mouseleave)="showChangePhoto = false">
        <img [src]="userPhoto" alt="Foto de usuario">
        <!-- Overlay para cambiar foto -->
            <div class="change-photo-overlay" *ngIf="showChangePhoto" (click)="toggleCambioFoto()">
              <i class="fas fa-camera"></i>
              <span>Cambiar foto</span>
            </div>
      </div>
    </div>
    <!-- Formulario para cambiar foto -->
<div *ngIf="mostrarCambioFoto" class="photo-change-container">
  <div class="photo-preview" *ngIf="previewFoto">
    <img [src]="previewFoto" alt="Vista previa">
  </div>
  
  <input type="file" id="photoInput" accept="image/*" (change)="onFileSelected($event)" hidden>
  <label for="photoInput" class="btn-select-photo">Seleccionar foto</label>
  
  <div class="photo-actions">
    <button class="btn-upload" (click)="cambiarFoto()" [disabled]="!fotoSeleccionada">
      Subir foto
    </button>
    <button class="btn-cancel" (click)="toggleCambioFoto()">
      Cancelar
    </button>
  </div>
</div>
    
    <div class="saldo-info">
      <div class="saldo-valor"><p class="saldo-label">Mi Saldo:</p> {{saldoUsuario}}</div>
    </div>
    
    <div class="botones-acciones">
      <button class="btn-accion" (click)="irARecargar()">RECARGAR SALDO <span class="btn-ir">IR</span></button>
      <button class="btn-accion" (click)="retirarSaldo()">RETIRAR SALDO <span class="btn-ir">IR</span></button>
      <button class="btn-accion" (click)="verHistorialApuestas()">HISTORIAL APUESTAS <span class="btn-ir">IR</span></button>
      <button class="btn-accion" (click)="verHistorialRetiros()">HISTORIAL RETIROS <span class="btn-ir">IR</span></button>
      <button class="btn-accion" (click)="toggleEditarPerfil()">EDITAR PERFIL <span class="btn-ir">IR</span></button>
      <!-- <button class="btn-accion btn-stream" (click)="goToStream()">IR AL STREAM <span class="btn-ir">IR</span></button> -->
      <button class="btn-stream-img" (click)="goToStream()">
      <img src="assets/image/Ahora_en_vivo.png" alt="Ir al Stream" style="width: 100%; max-width: 220px;">
      </button>
    </div>

<div class="perfil-content" *ngIf="mostrarEditarPerfil">
  <form [formGroup]="editarPerfilForm" (ngSubmit)="guardarCambios()">
    <div class="datos-usuario">
      <p>
        <label for="nombre"><strong>Nombres:</strong></label><br>
        <input id="nombre" type="text" formControlName="nombre" />
      </p>
      <p>
        <label for="apellido"><strong>Apellido:</strong></label><br>
        <input id="apellido" type="text" formControlName="apellido" />
      </p>
      <p>
        <label for="telefono"><strong>Teléfono:</strong></label><br>
        <input id="telefono" type="text" formControlName="telefono" />
      </p>
      <p>
        <label for="fechaNacimiento"><strong>Fecha de nacimiento:</strong></label><br>
        <input id="fechaNacimiento" type="date" formControlName="fechaNacimiento" />
      </p>
      <p>
        <label for="email"><strong>Correo electrónico:</strong></label><br>
        <input id="email" type="email" [value]="usuario?.email" disabled />
      </p>
    </div>
    <button type="submit" class="btn-guardar">Guardar cambios</button>
  </form>
</div>

  <!-- Botones de acciones del usuario -->
  <div class="user-actions-container">
    <button class="btn-change-password" (click)="cambiarContrasena()">
      <i class="fas fa-key"></i> CAMBIAR CONTRASEÑA
